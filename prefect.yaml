      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "0 17 * * 1-5"
        timezone: Asia/Shanghai
        slug: top10-holders-sync
        active: true
        parameters:
          schedule_slug: top10-holders-sync
  - name: 前十大流通股东交易日同步
    version: "1"
    tags: [shareholder-data]
    description: 每个交易日北京时间 17:05 同步前十大流通股东新增披露（公告日全市场提取，400 次/分钟限流）。
