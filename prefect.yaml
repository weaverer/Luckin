      - cron: "5 17 * * 1-5"
        timezone: Asia/Shanghai
        slug: top10-floatholders-sync
        active: true
        parameters:
          schedule_slug: top10-floatholders-sync
  - name: 股东人数交易日同步
    version: "1"
    tags: [shareholder-data]
    description: 每个交易日北京时间 17:10 同步股东人数新增披露（公告日全市场提取，400 次/分钟限流）。
    entrypoint: src/lucking/flows/shareholder_data.py:holder_count_sync
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "10 17 * * 1-5"
        timezone: Asia/Shanghai
        slug: holder-count-sync
        active: true
        parameters:
          schedule_slug: holder-count-sync
  - name: 前十大股东历史回补
    version: "1"
    tags: [shareholder-data, backfill]
    description: 人工按报告期季度末回补前十大股东（2024-01-01 起，逐日幂等，全程 ≤400 次/分钟）。
    entrypoint: src/lucking/flows/shareholder_data.py:top10_holders_backfill
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
  - name: 前十大流通股东历史回补
    version: "1"
    tags: [shareholder-data, backfill]
    description: 人工按报告期季度末回补前十大流通股东（2024-01-01 起，逐日幂等，全程 ≤400 次/分钟）。
    entrypoint: src/lucking/flows/shareholder_data.py:top10_float_holders_backfill
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
  - name: 股东人数历史回补
    version: "1"
    tags: [shareholder-data, backfill]
    description: 人工按公告日逐日回补股东人数（2024-01-01 起，逐日幂等，全程 ≤400 次/分钟）。
    entrypoint: src/lucking/flows/shareholder_data.py:holder_count_backfill
