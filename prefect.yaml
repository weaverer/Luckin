name: lucking
prefect-version: "3"

deployments:
  - name: default
    version: "1"
    tags: [trading-calendar]
    description: 同一个 Deployment 承载月度、年末和人工交易日历同步。
    entrypoint: src/lucking/flows/trading_calendar.py:sync_trading_calendar
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "0 2 1 * *"
        timezone: Asia/Shanghai
        slug: monthly-current-year
        active: true
        parameters:
          mode: monthly
          market_code: CN-S
          schedule_slug: monthly-current-year
      - cron: "30 2 20 12 *"
        timezone: Asia/Shanghai
        slug: year-end-next-year
        active: true
        parameters:
          mode: year_end
          market_code: CN-S
          schedule_slug: year-end-next-year

  - name: default
    version: "1"
    tags: [stock-list]
    description: 每日北京时间 09:00 同步固定 CN-S 股票列表。
    entrypoint: src/lucking/flows/stock_list.py:sync_stock_list
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "0 9 * * *"
        timezone: Asia/Shanghai
        slug: daily-stock-list
        active: true
        parameters:
          scope_code: CN-S
          schedule_slug: daily-stock-list

  - name: default
    version: "1"
    tags: [broker-recommendation]
    description: 每月 3 日和 4 日北京时间 12:00 同步当前月券商金股。
    entrypoint: src/lucking/flows/broker_recommendation.py:sync_broker_recommendations
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "0 12 3,4 * *"
        timezone: Asia/Shanghai
        slug: monthly-broker-recommendations
        active: true
        parameters:
          schedule_slug: monthly-broker-recommendations

  - name: manual
    version: "1"
    tags: [broker-recommendation, backfill]
    description: 人工逐月补跑券商金股，最多 120 个闭区间月份。
    entrypoint: src/lucking/flows/broker_recommendation.py:backfill_broker_recommendations
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}

  - name: manual
    version: "1"
    tags: [broker-recommendation, retry]
    description: 按原 run_id 显式重试券商金股同步。
    entrypoint: src/lucking/flows/broker_recommendation.py:retry_broker_recommendation_sync
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}

  - name: adj-factor-sync
    version: "1"
    tags: [market-data]
    description: 每个交易日北京时间 09:00 同步全市场日线复权因子（开盘前完成）。
    entrypoint: src/lucking/flows/market_data.py:market_data_sync
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "0 9 * * 1-5"
        timezone: Asia/Shanghai
        slug: adj-factor-sync
        active: true
        parameters:
          data_kind: ADJ_FACTOR
          schedule_slug: adj-factor-sync

  - name: daily-quote-sync
    version: "1"
    tags: [market-data]
    description: 每个交易日北京时间 17:00 同步全市场未复权日线行情。
    entrypoint: src/lucking/flows/market_data.py:market_data_sync
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "0 17 * * 1-5"
        timezone: Asia/Shanghai
        slug: daily-quote-sync
        active: true
        parameters:
          data_kind: DAILY_QUOTE
          schedule_slug: daily-quote-sync

  - name: daily-basic-sync
    version: "1"
    tags: [market-data]
    description: 每个交易日北京时间 17:45 同步全市场每日基本面指标。
    entrypoint: src/lucking/flows/market_data.py:market_data_sync
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "45 17 * * 1-5"
        timezone: Asia/Shanghai
        slug: daily-basic-sync
        active: true
        parameters:
          data_kind: DAILY_BASIC
          schedule_slug: daily-basic-sync

  - name: weekly-kline-sync
    version: "1"
    tags: [market-data]
    description: 每个交易日北京时间 18:30 同步全市场周K线（独立数据模型）。
    entrypoint: src/lucking/flows/market_data.py:market_data_sync
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "30 18 * * 1-5"
        timezone: Asia/Shanghai
        slug: weekly-kline-sync
        active: true
        parameters:
          data_kind: WEEKLY_KLINE
          schedule_slug: weekly-kline-sync

  - name: monthly-kline-sync
    version: "1"
    tags: [market-data]
    description: 每个交易日北京时间 18:30 同步全市场月K线（独立数据模型）。
    entrypoint: src/lucking/flows/market_data.py:market_data_sync
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "30 18 * * 1-5"
        timezone: Asia/Shanghai
        slug: monthly-kline-sync
        active: true
        parameters:
          data_kind: MONTHLY_KLINE
          schedule_slug: monthly-kline-sync

  - name: backfill
    version: "1"
    tags: [market-data, backfill]
    description: 人工按交易日区间回补行情数据（2024-01-01 起，逐日幂等）。
    entrypoint: src/lucking/flows/market_data.py:backfill_market_data
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}

  - name: index-factor-sync
    version: "1"
    tags: [index-factor]
    description: 每个交易日北京时间 17:00 同步全部指数技术因子（30 次/分钟限流）。
    entrypoint: src/lucking/flows/index_factor.py:index_factor_sync
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "0 17 * * 1-5"
        timezone: Asia/Shanghai
        slug: index-factor-sync
        active: true
        parameters:
          schedule_slug: index-factor-sync

  - name: index-factor-backfill
    version: "1"
    tags: [index-factor, backfill]
    description: 人工按交易日区间回补指数技术因子（2024-01-01 起，逐日幂等，全程 ≤30 次/分钟）。
    entrypoint: src/lucking/flows/index_factor.py:index_factor_backfill
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables: {}
